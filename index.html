<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sturfrymacro dashboard</title>
<meta name="description" content="UK economy: latest data and published forecasts for GDP, inflation, investment, the labour market, wages and financial markets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/site.js"></script>
<style>
  /* Summary box: latest outturn, then forecasts for the next releases */
  .box { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .card { background: var(--panel); border-radius: 8px; padding: 14px 16px; }
  .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3);
             margin: 0 0 8px; font-weight: 600; }
  .stat { margin: 0 0 8px; }
  .stat .v { font-size: 30px; font-weight: 700; line-height: 1.1; color: var(--blue); }
  .stat .l { color: var(--ink-2); font-size: 14px; }
  .fc-head { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .fc-rel { color: var(--ink-3); font-size: 13px; margin-bottom: 6px; }
  .fc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
            padding: 3px 0; border-top: 1px solid var(--grid); font-size: 15px; }
  .fc-row:first-of-type { border-top: 0; }
  .fc-row .who { color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .fc-row .who i { width: 14px; height: 0; border-top: 2.5px dashed; display: inline-block; }
  .fc-row .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .none { color: var(--ink-3); font-size: 14px; }
</style>
</head>
<body>
<header class="wrap">
  <h1>UK economy dashboard</h1>
  <p class="sub" id="sub">Latest data and published forecasts.</p>
</header>
<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>

<script>
// Everything on this page comes from data/dashboard/dashboard.json, which the
// dashboard builder (builders/dashboard/build.py) rewrites every weekday.

function renderBox(box) {
  const wrap = el("div", "box");
  const latest = el("div", "card");
  latest.append(el("h3", null, "Latest outturn"));
  box.latest.forEach(s => latest.append(el("div", "stat",
    `<div class="v">${s.prefix || ""}${fmt(s.value, s.decimals)}${s.unit}</div><div class="l">${s.label}, ${s.period}</div>`)));
  wrap.append(latest);
  box.forecasts.forEach((f, i) => {
    const c = el("div", "card");
    c.append(el("h3", null, f.card || (i === 0 ? "Next release: forecasts" : "Further ahead")));
    c.append(el("div", "fc-head", f.heading));
    if (f.release) c.append(el("div", "fc-rel", `ONS release due ${fmtDate(f.release)}`));
    if (f.note) c.append(el("div", "fc-rel", f.note));
    if (!f.items.length) c.append(el("div", "none", "No published forecast for this period."));
    f.items.forEach(it => c.append(el("div", "fc-row",
      `<span class="who"><i style="border-color:${it.colour}"></i>${it.who}</span><span class="val">${f.prefix || ""}${fmt(it.value, f.decimals)}${f.unit}</span>`)));
    wrap.append(c);
  });
  return wrap;
}

// Percentile charts (pay distribution) have the percentile itself on the x-axis
const PCT_TICKS = [10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90];
const pctLabel = p => p === 50 ? "Median" : p + "th";

function renderLineChart(canvas, chart) {
  const pct = chart.type === "percentile";
  const toX = d => pct ? d : timeX(d);
  const xs = chart.lines.flatMap(l => l.data.map(p => toX(p[0])));
  const datasets = chart.lines.map(l => {
    const sparse = l.kind === "forecast" && l.data.length <= 6;   // few points: show them
    return {
      label: l.name,
      data: l.data.map(p => ({x: toX(p[0]), y: p[1], d: p[0]})),
      borderColor: l.colour, backgroundColor: l.colour,
      borderWidth: 2, borderDash: l.kind === "forecast" ? [6, 4] : [],
      pointRadius: ctx => pct ? 3 : (sparse && ctx.dataIndex > 0) ? 3 : 0, pointHoverRadius: 4,
      tension: 0, spanGaps: false,
    };
  });
  new Chart(canvas, {
    type: "line",
    data: {datasets},
    options: {
      maintainAspectRatio: false, animation: false,
      interaction: {mode: "nearest", axis: "x", intersect: false},
      plugins: {
        legend: {display: false},
        tooltip: {callbacks: {
          title: items => pct ? pctLabel(items[0].raw.d) + " percentile" : niceLabel(items[0].raw.d),
          label: it => ` ${it.dataset.label}: ${fmt(it.raw.y, chart.decimals ?? 1)}`,
        }},
      },
      scales: {
        x: pct
          ? {type: "linear", min: 0, max: 100, grid: {display: false}, border: {color: "#627D98"},
             afterBuildTicks: axis => { axis.ticks = PCT_TICKS.map(v => ({value: v})); },
             ticks: {autoSkip: false, maxRotation: 0, callback: v => pctLabel(v)},
             title: {display: true, text: "Pay percentile (lower paid \u2192 higher paid)", color: "#486581"}}
          : {type: "linear", min: Math.floor(Math.min(...xs)), max: Math.ceil(Math.max(...xs)),
             grid: {display: false}, border: {color: "#627D98"},
             ticks: {stepSize: 1, callback: v => Number.isInteger(v) ? v : ""}},
        y: {min: chart.y_min,   // set in dashboard.json for charts that should start at zero
            grid: {color: ctx => ctx.tick.value === 0 ? "#9FB3C8" : "#D9E2EC"}, border: {display: false},
            ticks: {callback: v => fmt(v, chart.decimals ?? 1).replace(/\.0+$/, "")}},
      },
    },
  });
}

function renderBarChart(canvas, chart) {
  // Horizontal bars, UK highlighted; value and period labels drawn at bar ends
  const labelsPlugin = {
    id: "barLabels",
    afterDatasetsDraw(c) {
      const {ctx} = c; const meta = c.getDatasetMeta(0);
      ctx.save(); ctx.font = '13px "Source Sans 3", sans-serif'; ctx.fillStyle = "#486581"; ctx.textBaseline = "middle";
      meta.data.forEach((bar, i) => {
        const b = chart.bars[i]; const right = b.value >= 0;
        ctx.textAlign = right ? "left" : "right";
        ctx.fillText(`${b.value >= 0 ? "+" : ""}${fmt(b.value)}%${b.period ? `  (${b.period})` : ""}`.replace("+−", "−"),
                     bar.x + (right ? 6 : -6), bar.y);
      });
      ctx.restore();
    },
  };
  const vals = chart.bars.map(b => b.value);
  new Chart(canvas, {
    type: "bar",
    data: {labels: chart.bars.map(b => b.name),
           datasets: [{data: vals, backgroundColor: chart.bars.map(b => b.colour), borderRadius: 2, barPercentage: 0.7}]},
    options: {
      indexAxis: "y", maintainAspectRatio: false, animation: false,
      layout: {padding: {right: 120, left: 4}},
      plugins: {legend: {display: false}, tooltip: {callbacks: {label: it => ` ${fmt(it.raw)}%`}}},
      scales: {
        x: {suggestedMin: Math.min(0, ...vals) - 0.5, grid: {color: ctx => ctx.tick.value === 0 ? "#9FB3C8" : "#D9E2EC"},
            border: {display: false}, ticks: {callback: v => fmt(v).replace(".0", "")}},
        y: {grid: {display: false}, border: {display: false}, ticks: {color: "#102A43", font: {size: 14}}},
      },
    },
    plugins: [labelsPlugin],
  });
}

function renderChart(chart) {
  const fig = el("figure");
  fig.append(el("h4", null, chart.title), el("div", "units", chart.units));
  // A chart with "variants" (e.g. Bank Rate's policy rules) shows its own lines plus one
  // chosen variant's lines; buttons switch between them and redraw.
  const variants = chart.variants || [];
  let chosen = variants[0];
  let picker, formula;
  if (variants.length) {
    picker = el("div", "picker");
    picker.setAttribute("role", "group"); picker.setAttribute("aria-label", chart.variant_label || "Options");
    variants.forEach(v => {
      const b = el("button", null, v.name.replace(/ \(Bank\)$/, ""));
      b.type = "button";
      b.onclick = () => { chosen = v; draw(); };
      picker.append(b);
    });
    formula = el("div", "formula");
    fig.append(picker, formula);
  }
  const lg = el("div", "legend"); fig.append(lg);
  const holder = el("div", "canvas"); const canvas = el("canvas");
  canvas.setAttribute("role", "img"); canvas.setAttribute("aria-label", chart.title);
  holder.append(canvas); fig.append(holder);
  fig.append(el("figcaption", null, `Source: ${chart.source}. ${chart.note || ""}`));

  function draw() {
    const shown = {...chart, lines: (chart.lines || []).concat(chosen ? chosen.lines : [])};
    if (picker) {
      [...picker.children].forEach((b, i) => b.setAttribute("aria-pressed", variants[i] === chosen));
      formula.innerHTML = chosen.formula;   // our own HTML (sub/superscripts), from dashboard.json
    }
    // lines can opt out of the legend ("legend": false) and share an entry in legend_extra
    const keyed = shown.lines.filter(l => l.legend !== false).concat(chart.legend_extra || []);
    lg.innerHTML = "";
    lg.style.display = keyed.length > 1 ? "" : "none";
    keyed.forEach(l => lg.append(el("span", null,
      `<i class="${l.kind === "forecast" ? "dash" : ""}" style="border-color:${l.colour}"></i>${l.name}`)));
    const old = Chart.getChart(canvas); if (old) old.destroy();
    chart.type === "bars" ? renderBarChart(canvas, shown) : renderLineChart(canvas, shown);
  }
  return {fig, draw};
}

fetch("data/dashboard/dashboard.json", {cache: "no-cache"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    const main = document.getElementById("main"), nav = document.getElementById("nav");
    const vintages = Object.values(d.sources).map(s => `${s.name}: ${s.vintage}${s.stale ? " (could not refresh)" : ""}`);
    document.getElementById("sub").textContent =
      "Latest data (solid lines) and the most recent published forecasts (dashed). Refreshed every weekday.";
    d.sections.forEach(s => {
      nav.append(el("a", null, s.title)); nav.lastChild.href = "#" + s.id;
    });
    // separate page: fortnightly summary of external market commentary
    nav.append(el("a", "nav-page", "Market commentary →")); nav.lastChild.href = "commentary.html";
    d.sections.forEach(s => {
      const sec = el("section"); sec.id = s.id;
      sec.append(el("h2", null, s.title));
      // the labour market section links to its own page of more detailed indicators
      if (s.id === "labour") {
        sec.lastChild.append(el("a", "more", "More labour market indicators →"));
        sec.lastChild.lastChild.href = "labour.html";
      }
      sec.append(renderBox(s.box));
      const grid = el("div", "charts");
      s.charts.forEach(c => { const r = renderChart(c); grid.append(r.fig); requestAnimationFrame(r.draw); });
      sec.append(grid); main.append(sec);
    });
    document.getElementById("foot").innerHTML =
      `Forecasts: ${vintages.join(" · ")}. Outturn: ONS and OECD; markets from the Bank of England, US Treasury, Bundesbank, EIA, Ofgem and Yahoo Finance. ` +
      `Built from <a href="https://github.com/Emily-coding/Sturfrymacro">github.com/Emily-coding/Sturfrymacro</a>.`;
  })
  .catch(e => { document.getElementById("main").innerHTML = `<p class="error">Couldn't load the dashboard data (${e.message}).</p>`; });
</script>
</body>
</html>
